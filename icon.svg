<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203a"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5ee7ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset=".55" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#a77bff"/>
    </linearGradient>
    <radialGradient id="face" cx=".5" cy=".38" r=".7">
      <stop offset="0" stop-color="#1a2440"/>
      <stop offset="1" stop-color="#080b14"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="3"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- face + glowing ring -->
  <circle cx="256" cy="256" r="166" fill="url(#face)"/>
  <circle cx="256" cy="256" r="166" fill="none" stroke="url(#ring)" stroke-width="16" filter="url(#blur)" opacity=".85"/>
  <circle cx="256" cy="256" r="166" fill="none" stroke="url(#ring)" stroke-width="13"/>

  <!-- hour ticks -->
  <g stroke="#e8ecf4" stroke-linecap="round">
    <g stroke-width="11">
      <line x1="256" y1="118" x2="256" y2="146"/>
      <line x1="394" y1="256" x2="366" y2="256"/>
      <line x1="256" y1="394" x2="256" y2="366"/>
      <line x1="118" y1="256" x2="146" y2="256"/>
    </g>
    <g stroke-width="6" stroke-opacity=".45">
      <line x1="325" y1="136.5" x2="320" y2="145.2"/>
      <line x1="375.5" y1="187" x2="366.8" y2="192"/>
      <line x1="375.5" y1="325" x2="366.8" y2="320"/>
      <line x1="325" y1="375.5" x2="320" y2="366.8"/>
      <line x1="187" y1="375.5" x2="192" y2="366.8"/>
      <line x1="136.5" y1="325" x2="145.2" y2="320"/>
      <line x1="136.5" y1="187" x2="145.2" y2="192"/>
      <line x1="187" y1="136.5" x2="192" y2="145.2"/>
    </g>
  </g>

  <!-- hands at 10:09:30 -->
  <g stroke-linecap="round">
    <g stroke="#000" stroke-opacity=".45" filter="url(#soft)" transform="translate(0 6)">
      <line x1="256" y1="256" x2="183" y2="214" stroke-width="20"/>
      <line x1="256" y1="256" x2="342" y2="170" stroke-width="13"/>
    </g>
    <line x1="256" y1="256" x2="183" y2="214" stroke="#f4f7fc" stroke-width="20"/>
    <line x1="256" y1="256" x2="342" y2="170" stroke="#f4f7fc" stroke-width="13"/>
    <line x1="236" y1="292" x2="314" y2="157" stroke="#5ee7ff" stroke-width="7" filter="url(#soft)" opacity=".8"/>
    <line x1="236" y1="292" x2="314" y2="157" stroke="#5ee7ff" stroke-width="5"/>
  </g>
  <circle cx="256" cy="256" r="15" fill="#5ee7ff"/>
  <circle cx="256" cy="256" r="6" fill="#07090f"/>
</svg>
